<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NOTLegendXD - Horror Portal</title>
  
  <!-- Font Awesome & Google Fonts -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Creepster&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
    }

    /* 1. DARK HORROR THEME (DEFAULT) */
    :root {
      --bg-color: #030000;
      --text-color: #ffffff;
      --subtext-color: #aaaaaa;
      --card-bg: rgba(18, 5, 5, 0.85);
      --header-bg: rgba(15, 3, 3, 0.92);
      --nav-bg: rgba(15, 3, 3, 0.9);
      --nav-btn-bg: #1a0a0a;
      --border-color: #331111;
      --accent-color: #ff0000;
      --brand-gradient: linear-gradient(135deg, #ffffff 0%, #ff1a1a 45%, #800000 100%);
      --brand-shadow: rgba(255, 0, 0, 0.8);
      --brand-glow: rgba(255, 0, 0, 1);
      --hero-bg: linear-gradient(rgba(10,0,0,0.8), rgba(20,0,0,0.95));
      --vignette-shadow: inset 0 0 100px rgba(255, 0, 0, 0.4);
    }

    /* 2. LIGHT THEME */
    body.theme-light {
      --bg-color: #f4f4f9;
      --text-color: #111111;
      --subtext-color: #555555;
      --card-bg: rgba(255, 255, 255, 0.9);
      --header-bg: rgba(255, 255, 255, 0.95);
      --nav-bg: rgba(240, 240, 245, 0.95);
      --nav-btn-bg: #e0e0e0;
      --border-color: #dddddd;
      --accent-color: #0077ff;
      --brand-gradient: linear-gradient(135deg, #002244 0%, #0077ff 50%, #00aaff 100%);
      --brand-shadow: rgba(0, 119, 255, 0.6);
      --brand-glow: rgba(0, 119, 255, 0.9);
      --hero-bg: linear-gradient(rgba(240,240,245,0.8), rgba(220,220,230,0.95));
      --vignette-shadow: inset 0 0 80px rgba(0, 150, 255, 0.2);
    }

    /* 3. PURPLE MYSTIC THEME */
    body.theme-purple {
      --bg-color: #0d001a;
      --text-color: #f3e8ff;
      --subtext-color: #b39ddb;
      --card-bg: rgba(25, 10, 40, 0.85);
      --header-bg: rgba(20, 5, 35, 0.92);
      --nav-bg: rgba(20, 5, 35, 0.9);
      --nav-btn-bg: #220a38;
      --border-color: #4a148c;
      --accent-color: #aa00ff;
      --brand-gradient: linear-gradient(135deg, #ffffff 0%, #d500f9 45%, #4a148c 100%);
      --brand-shadow: rgba(170, 0, 255, 0.8);
      --brand-glow: rgba(170, 0, 255, 1);
      --hero-bg: linear-gradient(rgba(20,0,40,0.8), rgba(40,0,70,0.95));
      --vignette-shadow: inset 0 0 100px rgba(170, 0, 255, 0.4);
    }

    /* 4. PINK CYBER THEME */
    body.theme-pink {
      --bg-color: #1a0010;
      --text-color: #ffe6f2;
      --subtext-color: #f48fb1;
      --card-bg: rgba(40, 10, 28, 0.85);
      --header-bg: rgba(30, 5, 20, 0.92);
      --nav-bg: rgba(30, 5, 20, 0.9);
      --nav-btn-bg: #380a26;
      --border-color: #880e4f;
      --accent-color: #ff007f;
      --brand-gradient: linear-gradient(135deg, #ffffff 0%, #ff007f 45%, #880e4f 100%);
      --brand-shadow: rgba(255, 0, 127, 0.8);
      --brand-glow: rgba(255, 0, 127, 1);
      --hero-bg: linear-gradient(rgba(40,0,25,0.8), rgba(70,0,45,0.95));
      --vignette-shadow: inset 0 0 100px rgba(255, 0, 127, 0.4);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 50px;
      overflow-x: hidden;
      position: relative;
      touch-action: manipulation;
    }

    /* WELCOME OVERLAY */
    .welcome-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-color);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      animation: fadeOutWelcome 1s ease 2.8s forwards;
      pointer-events: none;
    }

    .welcome-text {
      font-family: 'Cinzel Decorative', 'Creepster', serif;
      font-size: clamp(24px, 6vw, 55px);
      font-weight: 900;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 3px;
      filter: drop-shadow(0 0 25px var(--brand-glow));
      animation: welcomePop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .welcome-subtext {
      margin-top: 15px;
      font-size: 16px;
      color: var(--subtext-color);
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeInSub 1s ease 0.8s forwards;
    }

    @keyframes welcomePop {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeInSub {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOutWelcome {
      0% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }

    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -3;
      pointer-events: none;
    }

    .fog-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 100vh;
      background: radial-gradient(circle at 20% 50%, rgba(255, 0, 0, 0.12), transparent 50%),
                  radial-gradient(circle at 80% 50%, rgba(120, 0, 0, 0.15), transparent 50%);
      z-index: -2;
      pointer-events: none;
      animation: moveFog 18s infinite alternate ease-in-out;
    }

    @keyframes moveFog {
      0% { transform: translateX(0); }
      100% { transform: translateX(-40%); }
    }

    .pulse-vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      box-shadow: var(--vignette-shadow);
      animation: vignettePulse 3s infinite alternate ease-in-out;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes vignettePulse {
      0% { opacity: 0.4; }
      100% { opacity: 0.9; }
    }

    /* Header & Navigation */
    header {
      background-color: var(--header-bg);
      backdrop-filter: blur(8px);
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent-color);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-wrapper {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 2px solid var(--accent-color);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      box-shadow: 0 0 12px var(--accent-color);
      flex-shrink: 0;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-family: 'Cinzel Decorative', 'Creepster', serif;
      font-size: 26px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      filter: drop-shadow(0 0 10px var(--brand-shadow));
    }

    .brand-tagline {
      font-size: 11px;
      color: var(--subtext-color);
      display: block;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .theme-selector {
      position: relative;
    }

    .theme-toggle-btn {
      background-color: var(--nav-btn-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 40px;
      background-color: var(--header-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 105;
      min-width: 140px;
    }

    .theme-dropdown.show { display: block; }

    .theme-option {
      padding: 10px 15px;
      color: var(--text-color);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-option:hover {
      background-color: var(--nav-btn-bg);
      color: var(--accent-color);
    }

    .social-links { display: flex; gap: 8px; }

    .social-icon {
      color: var(--text-color);
      font-size: 15px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--nav-btn-bg);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .subscribe-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--accent-color);
      color: #ffffff;
      padding: 9px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background-color: var(--nav-btn-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 5px 15px;
      width: 180px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-color);
      width: 100%;
    }

    nav {
      background-color: var(--nav-bg);
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .nav-btn {
      background-color: var(--nav-btn-bg);
      color: var(--subtext-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }

    .nav-btn.active {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .hero-banner {
      background: var(--hero-bg);
      padding: 25px;
      margin: 20px 40px;
      border-radius: 12px;
      border-left: 5px solid var(--accent-color);
    }

    .hero-banner h2 { font-size: 22px; color: var(--accent-color); margin-bottom: 8px; }
    .hero-banner p { color: var(--subtext-color); font-size: 14px; }

    .section-title {
      margin: 25px 40px 15px 40px;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 0 40px;
    }

    .video-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .video-card:hover { border-color: var(--accent-color); transform: translateY(-4px); }

    .thumbnail-container {
      position: relative;
      width: 100%;
      height: 165px;
      background-color: #000;
    }

    .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: var(--accent-color);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      box-shadow: 0 0 15px var(--accent-color);
    }

    .video-info { padding: 14px; }
    .video-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
    .video-desc { font-size: 12px; color: var(--subtext-color); }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      width: 92%;
      max-width: 850px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--accent-color);
    }

    .close-btn {
      position: absolute;
      top: 8px; right: 15px;
      color: white; font-size: 28px;
      cursor: pointer;
      z-index: 1001;
    }

    .iframe-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }

    @media (max-width: 768px) {
      header { padding: 12px 20px; flex-direction: column; align-items: flex-start; }
      .header-right { width: 100%; justify-content: space-between; }
      .search-box { width: 100%; }
      .hero-banner, .video-grid, .section-title { margin-left: 15px; margin-right: 15px; }
      .video-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
    let currentTheme = 'dark';

    function toggleThemeDropdown() {
      document.getElementById('themeDropdown').classList.toggle('show');
    }

    window.addEventListener('click', function(e) {
      if (!e.target.closest('.theme-selector')) {
        document.getElementById('themeDropdown').classList.remove('show');
      }
    });

    function setTheme(theme) {
      currentTheme = theme;
      document.body.className = '';
      const text = document.getElementById('currentThemeText');
      const icon = document.getElementById('currentThemeIcon');

      if (theme === 'dark') {
        document.body.classList.add('theme-dark');
        text.innerText = 'Dark Mode';
        icon.className = 'fas fa-ghost';
      } else if (theme === 'light') {
        document.body.classList.add('theme-light');
        text.innerText = 'Light Mode';
        icon.className = 'fas fa-sun';
      } else if (theme === 'purple') {
        document.body.classList.add('theme-purple');
        text.innerText = 'Purple Mode';
        icon.className = 'fas fa-hat-wizard';
      } else if (theme === 'pink') {
        document.body.classList.add('theme-pink');
        text.innerText = 'Pink Mode';
        icon.className = 'fas fa-heart';
      }

      document.getElementById('themeDropdown').classList.remove('show');
      initParticles();
    }

    // Dynamic Canvas Particles
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let particles = [];

    function initParticles() {
      particles = [];
      const count = window.innerWidth < 768 ? 30 : 60;

      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2.5 + 1,
          speedY: -(Math.random() * 1.2 + 0.3),
          speedX: (Math.random() - 0.5) * 0.8,
          alpha: Math.random() * 0.8 + 0.2
        });
      }
    }
    initParticles();

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        p.y += p.speedY;
        p.x += p.speedX;

        if (p.y < -10) {
          p.y = canvas.height + 10;
          p.x = Math.random() * canvas.width;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);

        if (currentTheme === 'dark') ctx.fillStyle = `rgba(255, 30, 30, ${p.alpha})`;
        else if (currentTheme === 'light') ctx.fillStyle = `rgba(0, 120, 255, ${p.alpha})`;
        else if (currentTheme === 'purple') ctx.fillStyle = `rgba(180, 50, 255, ${p.alpha})`;
        else if (currentTheme === 'pink') ctx.fillStyle = `rgba(255, 50, 150, ${p.alpha})`;

        ctx.shadowBlur = 8;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fill();
      }
      requestAnimationFrame(animate);
    }
    animate();

    const videos = [
      { id: "osRoTgrH13Q", title: "I Survived The Most Terrifying Minecraft Monster...", desc: "NOTLegendXD - Terrifying Survival Horror", category: "supernatural", thumb: "https://img.youtube.com/vi/osRoTgrH13Q/hqdefault.jpg" },
      { id: "7XB4AOmOp-0", title: "I Survived Every Minecraft Horror Entity...", desc: "NOTLegendXD - Every Horror Entity Challenge", category: "psychological", thumb: "https://img.youtube.com/vi/7XB4AOmOp-0/hqdefault.jpg" },
      { id: "N6UE0PG8YRo", title: "That Thing Again ! Minecraft Creepypasta java", desc: "NOTLegendXD - Creepypasta Java Edition", category: "classics", thumb: "https://img.youtube.com/vi/N6UE0PG8YRo/hqdefault.jpg" },
      { id: "3z8PTSEKCLI", title: "I Found Minecraft’s SCARIEST Horse… [Creepy Horse]", desc: "NOTLegendXD - Scariest Horse Mod", category: "gothic", thumb: "https://img.youtube.com/vi/3z8PTSEKCLI/hqdefault.jpg" },

    let currentCategory = 'all';

    function displayVideos(items) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';
      items.forEach(video => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => openVideo(video.id);
        card.innerHTML = `
          <div class="thumbnail-container">
            <img src="${video.thumb}" alt="${video.title}">
            <div class="play-btn"><i class="fas fa-play"></i></div>
          </div>
          <div class="video-info">
            <div class="video-title">${video.title}</div>
            <div class="video-desc">${video.desc}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openVideo(videoId) {
      document.getElementById('youtubeIframe').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      document.getElementById('videoModal').style.display = 'flex';
    }

    function closeVideo() {
      document.getElementById('youtubeIframe').src = '';
      document.getElementById('videoModal').style.display = 'none';
    }

    function filterCategory(cat, evt) {
      currentCategory = cat;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      if(evt) evt.target.classList.add('active');
      applySearchAndFilter();
    }

    function applySearchAndFilter() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = videos.filter(v => {
        const matchesCategory = (currentCategory === 'all') || (v.category === currentCategory);
        const matchesSearch = v.title.toLowerCase().includes(query) || v.desc.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });
      displayVideos(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applySearchAndFilter);
    displayVideos(videos);
  </script>
